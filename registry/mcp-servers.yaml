# Declarative MCP server catalog. The console writes this file; the reconciler
# applies it. Git is the audit log.
#
# SECRETS DO NOT BELONG HERE. `env` lists variable *names* only — values come
# from macOS Keychain via scripts/up.sh. The console can report that a required
# var is present; it can never read or display the value.
#
# Two kinds of entry:
#
#   kind: container  (default) — an MCP server we run. The reconciler starts it.
#   kind: external              — an MCP endpoint that already exists somewhere
#                                 else and that we merely point clients at.
#                                 Nothing is started; it is catalogued here so
#                                 the risk level and credit still get recorded.
#
# Schema per entry:
#   name     required  identifier (a-z0-9-); also the service name for containers
#   kind     optional  container | external      (default: container)
#   enabled  required  false leaves it catalogued but not started/advertised
#   clients  optional  which clients should register it (informational today;
#                      wiring is still manual in Open WebUI / HA)
#   source   optional  upstream project URL + license, for credit
#   risk     optional  see below; defaults to standard
#
#   container only:
#     image    required  container image
#     command  optional  passed to the container
#     port     required  host port to publish (container side is always 8000)
#     env      optional  env var NAMES passed through from the host environment
#
#   external only:
#     url      required  the MCP endpoint clients should use
#     auth     optional  the env var / Keychain item holding this endpoint's
#                        token. INFORMATIONAL — nothing here injects it. The
#                        token goes in the CLIENT's registration (Open WebUI's
#                        MCP entry, as an Authorization header). Recorded so
#                        the registry answers "what do I need to wire this up",
#                        which matters once there are several of one service.
#
# ── Risk levels ("danger zone") ─────────────────────────────────────────
# The point is not to stop you installing something powerful. It is to make
# sure powerful things are turned on deliberately, by a person, on a date,
# with the reason written down — instead of drifting in unnoticed.
#
#   standard   Reads or writes one service you already run. The default.
#   elevated   Can act outward in ways that are hard to undo (send mail, post,
#              delete without a trash), or has a broad tool surface.
#   dangerous  Can change the machine or the stack itself: edit config files,
#              read arbitrary files, run code, manage other containers.
#
# Anything above `standard` must also carry `why`, `accepted_by`, and
# `accepted_on`. The reconciler refuses to start it otherwise — see
# reconciler/reconcile.py. Turning it off again needs no ceremony.

servers:
  # Web search, uniform across every client that speaks MCP rather than a
  # per-client feature. Open WebUI has its own built-in Web Search toggle
  # (Settings -> Admin -> Web); deliberately not used here, because it is a
  # separate per-instance config with no equivalent in Home Assistant. This
  # entry is the one thing both clients point at instead.
  #
  # The official reference server (modelcontextprotocol/servers,
  # @modelcontextprotocol/server-brave-search, MIT) speaks stdio only, so
  # supergateway (supercorp-ai/supergateway, licence unresolved — see
  # credits.md's existing VERIFY) wraps it as HTTP on the required 8000.
  # Both versions are pinned in `command` rather than left on `latest`,
  # which is better than the npx-at-runtime pattern credits.md already
  # flags as a known weakness, though not as strong as a built, pushed
  # image: confirming the pin still means a network fetch on every
  # container start, just of a known version rather than whatever is
  # newest that day. Verified directly before writing this entry: pulled
  # tools/list over the real HTTP endpoint and got brave_web_search and
  # brave_local_search back.
  - name: brave-search
    kind: container
    image: node:22-alpine
    command: >
      sh -c "npm install -g supergateway@3.4.3
      @modelcontextprotocol/server-brave-search@0.6.2 &&
      npx -y supergateway --stdio
      'npx -y @modelcontextprotocol/server-brave-search@0.6.2'
      --port 8000 --outputTransport streamableHttp"
    port: 8299
    env: [BRAVE_API_KEY]
    enabled: true
    # One tool (brave_web_search), not fifty-nine — the reasoning that
    # excluded Tududi and Vikunja from voice does not apply here, but this
    # is still a live decision: a spoken query now leaves the house for
    # Brave's API. Recorded, not defaulted either way.
    clients: [open-webui, home-assistant]
    source:
      url: https://github.com/modelcontextprotocol/servers
      license: MIT
    risk:
      level: standard
      why:
        - "Read-only: no delete, no state, no side effect beyond the
           search itself."
        - "Sends the query text to Brave's API — a real disclosure, same
           shape as any other external tool, not a chat-content leak to
           an LLM vendor."
      accepted_by: tmeuze
      accepted_on: 2026-08-27

  # Outline serves MCP itself — no wrapper container, no supergateway, no
  # npx-at-runtime. Clients point straight at it.
  #
  # MULTIPLE INSTANCES: one entry each, named for the instance rather than the
  # product, with its own token. Entry names must be unique (the reconciler
  # enforces it), and each is registered separately in the client — there is no
  # merging, so a model sees them as distinct tool sets and can be pointed at
  # one knowledge base rather than all of them.
  - name: outline-everything
    kind: external
    url: https://et.a64.one/mcp
    auth: OUTLINE_EVERYTHING_API_KEY
    enabled: true
    clients: [open-webui, home-assistant]
    source:
      url: https://github.com/outline/outline
      license: BSL 1.1 — check before any commercial use
    risk:
      level: standard

  # Template for a second instance. Copy, rename, give it its own Keychain
  # item, enable.
  # - name: outline-<instance>
  #   kind: external
  #   url: https://<host>/mcp
  #   auth: OUTLINE_<INSTANCE>_API_KEY
  #   enabled: false
  #   clients: [open-webui]
  #   source:
  #     url: https://github.com/outline/outline
  #     license: BSL 1.1 — check before any commercial use
  #   risk:
  #     level: standard

  # Tududi serves MCP itself at /api/mcp — streamable HTTP, no wrapper needed.
  # Requires FF_ENABLE_MCP=true on the Tududi side and v1.0.0 or later.
  #
  # AUTH: bearer token in the Authorization header, generated per user in
  # Tududi's Profile settings. It is configured on the CLIENT (Open WebUI's
  # MCP server entry), not here — external entries carry no credentials.
  #
  # NOTE: one token means one Tududi account's tasks, for everyone using that
  # client. Same shape as the memory problem, without a shim to solve it: if
  # two people need their own task lists, each needs their own client-side
  # registration with their own token.
  - name: tududi
    kind: external
    url: https://tududi.example.tld/api/mcp # VERIFY your host
    auth: TUDUDI_API_TOKEN
    enabled: false # flip once Tududi is running and the token is issued
    # Not on the voice pipeline: 59 tools is far too much context for a
    # 1-2s spoken response. Same reasoning as vikunja.
    clients: [open-webui]
    source:
      url: https://github.com/chrisvel/tududi
      license: VERIFY
    risk:
      level: elevated
      why:
        - "59 tools across tasks, projects, notes, goals, habits and people —
           a very broad surface for one integration."
        - "Can create, modify and delete across all of them. VERIFY whether
           Tududi has a trash before trusting deletes to be recoverable."
      accepted_by: tmeuze
      accepted_on: 2026-08-17

  # Hindsight speaks MCP natively — no wrapper, no shim, no first-party code.
  #
  # ONE ENTRY PER BANK. The bank is in the URL, and each MCP connection is
  # scoped to exactly one; the tools have no bank parameter, so a caller cannot
  # reach another bank by asking. That is what makes per-person memory safe
  # here, and it is why there is no shim any more.
  #
  # Two rules that keep it that way:
  #   * Stay in SINGLE-bank mode. Multi-bank mode exposes extra tools that take
  #     a bank id as an argument, which hands the choice back to the model —
  #     exactly what the URL scoping prevents.
  #   * Keep the tenant API key set (see docker-compose.yml). Without it the
  #     endpoint is open and every bank is readable by anything on the network.
  - name: hindsight-household
    kind: external
    # EDIT THIS HOST. Open WebUI runs on the VPS, so a .local name it cannot
    # resolve is the one thing that is guaranteed not to work — use the Mac's
    # Tailscale name or 100.x address, matching HOST_NAME.
    url: http://EDIT-ME:8888/mcp/household/
    auth: HINDSIGHT_API_KEY
    enabled: true
      # The bank is in the path, so no custom header is needed to SELECT a
      # bank — the thing that made per-person voice memory impossible with the
      # previous backend.
      #
      # Authentication is a separate matter, and HA cannot do it directly: its
      # MCP client speaks OAuth only, Hindsight takes a static API key in an
      # Authorization header, and there is no overlap. Reaching this from Home
      # Assistant needs a proxy that adds the header — see docs/proxy.md.
    clients: [home-assistant]
    source:
      url: https://github.com/vectorize-io/hindsight
      license: MIT
    risk:
      level: elevated
      why:
        - "Holds memories; a wrong bank id in a client points someone at
           another person's history."
        - "27 tools including delete. VERIFY whether Hindsight has a trash
           before trusting deletes to be recoverable."
      accepted_by: tmeuze
      accepted_on: 2026-08-19

  # One of these per person. The bank name is what scopes it — keep them
  # distinct and keep them out of the voice pipeline.
  - name: hindsight-tmeuze
    kind: external
    # EDIT THIS HOST. Open WebUI runs on the VPS, so a .local name it cannot
    # resolve is the one thing that is guaranteed not to work — use the Mac's
    # Tailscale name or 100.x address, matching HOST_NAME.
    url: http://EDIT-ME:8888/mcp/tmeuze/
    auth: HINDSIGHT_API_KEY
    enabled: true
    # Deliberately NOT home-assistant: a voice satellite cannot tell who is
    # speaking, so a personal bank must never be on that pipeline.
    clients: [open-webui]
    source:
      url: https://github.com/vectorize-io/hindsight
      license: MIT
    risk:
      level: elevated
      why:
        - "Personal memories. Registering this in a shared client would expose
           them to everyone using it."
      accepted_by: tmeuze
      accepted_on: 2026-08-19

  - name: vikunja
    image: node:22-alpine
    command: >
      npx -y supergateway
      --stdio "npx -y @aimbitgmbh/vikunja-mcp"
      --outputTransport streamableHttp
      --port 8000
    port: 8002
    env: [VIKUNJA_URL, VIKUNJA_API_TOKEN]
    enabled: true
    # Deliberately not on the voice pipeline — see docs/home-assistant.md.
    clients: [open-webui]
    source:
      url: https://www.npmjs.com/package/@aimbitgmbh/vikunja-mcp
      license: VERIFY
    risk:
      level: elevated
      why:
        - "Vikunja has no trash or undo — a delete is permanent."
      accepted_by: tmeuze
      accepted_on: 2026-08-16

  # Example of a `dangerous` entry, left disabled. ha-mcp exposes 88+ tools
  # including file access and YAML config editing, and authenticates with a
  # secret in the URL by default. Enable only with ha_auth mode, and never
  # attach it to the voice pipeline — a malicious calendar entry or email that
  # the model reads could otherwise reach these tools.
  - name: ha-mcp
    image: ghcr.io/homeassistant-ai/ha-mcp:latest # VERIFY image path
    port: 8004
    env: [HA_MCP_URL, HA_MCP_TOKEN]
    enabled: false
    clients: [open-webui]
    source:
      url: https://github.com/homeassistant-ai/ha-mcp
      license: VERIFY
    risk:
      level: dangerous
      why:
        - "Can edit Home Assistant YAML config and read files on the HA host."
        - "Can create and modify automations, which then run on their own."
        - "Default auth puts a secret in the URL, which leaks into logs and history."
      # No accepted_by/accepted_on: the reconciler will refuse to start this
      # until a person fills those in. That is the intended friction.
