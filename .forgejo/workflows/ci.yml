# CI for Forgejo Actions. Same syntax as GitHub Actions.
#
# This is the gate that matters: merging is what deploys, so anything broken
# here is broken on the mini. Keep it fast and keep it honest — it should fail
# when something is actually wrong, not warn and pass.
#
# FIRST RUN WILL FAIL: `npm ci` needs a package-lock.json, and memory-mcp/ has
# never been installed. Run `npm install` there, commit the lockfile, then this
# passes. (Use `npm ci` rather than `npm install` on purpose — CI should build
# the exact versions that were committed, not silently pick up newer ones.)
#
# The console has its own CI in the novak-konzol repo.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    name: MCP registry is valid
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip3 install --quiet pyyaml
      - name: Validate registry and risk acceptances
        # --dry-run validates and renders without touching containers. Fails if
        # an elevated/dangerous server is enabled without a recorded acceptance.
        run: python3 reconciler/reconcile.py --dry-run

  memory-mcp:
    name: memory-mcp builds
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: memory-mcp
      - run: npm run typecheck
        working-directory: memory-mcp
      - run: npm run build
        working-directory: memory-mcp
