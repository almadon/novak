# Ingest service behaviour (decision #57). Optional: nothing here runs unless
# INGEST_ENABLED=true in .env. Validate with:
#   python3 -m novak_ingest check registry/ingest.yaml   (from ingest/)
#
# SECRETS DO NOT BELONG HERE. Sinks use no credentials of their own: they go
# through the gateway, whose key is INGEST_GATEWAY_KEY in .env / the Keychain.
#
# Passive work always yields to active work: the worker starts a unit of work
# (one chunk of audio, one model call) only after no model has been used for
# `quiet_s` seconds, so Open WebUI chat and Home Assistant voice are never
# queued behind a recording.

ingest:
  idle:
    probe: ollama       # ollama | none (none = never wait; only for a dedicated box)
    quiet_s: 180        # how long the models must be unused before passive work starts
    poll_s: 15
  stt:
    path: /inference    # whisper.cpp server. An OpenAI-style server: /v1/audio/transcriptions
    language: auto
    chunk_s: 60         # one unit of work; cuts land on silences within search_s of this
    search_s: 15
  tasks:
    # auto: a task sink creates each task at once. Adding is not destructive, so
    # it is not held; the notification just says what was added. Removing things
    # is a different matter and goes through the gateway's confirmation.
    # confirm: every task waits for approval (a review link in the notification).
    # With no task sink enabled, tasks wait either way.
    mode: auto
  summary:
    # `chat`, not `deep`: it is already resident, so summarising never evicts
    # the models someone is waiting on. `deep` (27B) would swap them out.
    role: chat
    window_words: 2500  # transcripts longer than this are summarised in parts

  # Whose recording it is. A person's notes, memories and tasks go to that
  # person's own accounts, through the gateway (decision #60): ingest holds one
  # trusted gateway key (INGEST_GATEWAY_KEY) and names the owner on each call, so
  # the gateway applies their tools and credentials and logs it as theirs.
  # The owner is, in order: an authenticated uploader's X-Owner header (or an
  # inbox sidecar's "owner"), `sources[<X-Source label>]`, then `default`.
  # Names are the people in registry/people.yaml. With none, sinks that need an
  # owner report it and tasks wait for approval.
  owners:
    default: ""                    # e.g. tmeuze
    sources: {}                    # e.g. {omi-ushy: ushy}
    people: {}
    # people:
    #   tmeuze:
    #     ticker_category: Novak tmeuze       # where their task notifications go
    #     vars: {outline_collection: "<collection id from list_collections>"}

  # A sink names a service and a tool, never an endpoint or a credential: which
  # account it reaches is whatever the owner has (their `outline-1-<name>`,
  # `hindsight-<name>`, `tududi-1-<name>` entry). Add `entry:` to pin one when a
  # person has several. kind: note (a finished note), memory (text to
  # remember), task (called when a task is added or approved).
  # Placeholders: note {title} {body} {summary} {recorded} {recording_id};
  # memory {title} {text} {summary} {recording_id} {recorded_iso}; task {title}
  # {detail} {due}; plus any `vars` of the owner. All are disabled until the
  # owner's tools are checked (`novak gateway ...` / the gateway's tools/list).
  # An older sink with an `mcp: {url_env, token_env}` block still works directly.
  sinks:
    - name: outline-note
      kind: note
      enabled: false
      service: outline
      tool: create_document
      # Set the owner's collection with a var, e.g. collectionId: "{outline_collection}"
      args: {title: "{title}", text: "{body}", publish: false}

    - name: hindsight-memory
      kind: memory
      enabled: false
      service: hindsight             # the owner's personal bank, never household
      tool: retain
      # document_id makes a re-run replace the memory instead of duplicating it.
      args:
        content: "Recording {recorded}: {title}. {text}"
        context: "Voice recording transcribed by Novak ingest"
        document_id: "recording-{recording_id}"
        timestamp: "{recorded_iso}"
        tags: [ingest]

    - name: tududi-task
      kind: task
      enabled: false
      service: tududi
      tool: create_task
      args: {name: "{title}", note: "{detail}", due_date: "{due}"}
