# Novak stack. This one file supports two different hosts, gated behind
# compose profiles and .env, not two different files (decision #28):
#   - Apple Silicon: oMLX runs natively on the host (Metal/MLX cannot run
#     in Docker), reached via host.docker.internal. The `ollama` service
#     stays off (no profile) on this shape.
#   - Linux + GPU: the `ollama` profile runs the engine in-stack instead;
#     see docs/ollama-settings.md. Spire (Unraid, RDNA4/Vulkan) is the
#     reference deployment as of decision #33 and is where most active
#     development now happens; Mitochon (the Mac) stays supported for oMLX
#     work.
# Start with scripts/up.sh on macOS (pulls secrets from Keychain); on
# Unraid, apply via Compose Manager against real .env values (no Keychain
# on that platform yet — see decision #33 and the still-open bootstrap-unraid
# roadmap item). Either way, don't run bare `docker compose up` on macOS.
#
# PLACEMENT: everything in this file — Hindsight, the console, Open WebUI,
# the Wyoming voice services, and (where enabled) Ollama — runs on ONE
# host. The only thing off-host is the reverse proxy fronting the portal
# and Open WebUI, on a LAN-neighboring machine. See docs/architecture.md §
# Placement.

name: novak

services:
  # ── Chat frontend ─────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-13400}:8080"
    environment:
      # Points at DEFAULT_ENGINE_BASE_URL (.env) by default — the one
      # setting every service falls back to unless it has a more specific
      # override (decision #28/#30). Set OWUI_INFERENCE_BASE_URL instead
      # once the router (decision #21) is configured, to get the persona
      # injected — the router exposes the same model names (chat, deep,
      # ha-voice) oMLX does, so nothing about model selection in Open
      # WebUI changes. Left pointed at DEFAULT_ENGINE_BASE_URL by default
      # rather than switched automatically: the router is optional and
      # gated behind its own compose profile, and this line has no way to
      # know whether that profile is active.
      OPENAI_API_BASE_URL: "${OWUI_INFERENCE_BASE_URL:-${DEFAULT_ENGINE_BASE_URL}}"
      OPENAI_API_KEY: "${OMLX_API_KEY:-none}"
      ENABLE_OLLAMA_API: "false"
      # Router-only: router/config.yaml exposes a `task` model built for
      # exactly this — Open WebUI's own background calls (title, tags,
      # follow-ups, autocomplete), routed around persona injection and
      # whatever weight/thinking cost the active chat model carries.
      # Measured directly: the same trivial request cost 574 prompt tokens
      # and 2.13s through `chat` (persona injected) against 15 tokens and
      # 0.34s through `task` (not in persona_hook.py's PERSONA_MAP).
      # Blank (the default) leaves Open WebUI's own Task Model setting
      # alone — correct when the router isn't configured, since `task`
      # isn't a model name anywhere else. Set OWUI_TASK_MODEL=task once
      # OWUI_INFERENCE_BASE_URL points at the router. Set here, not left
      # to the admin UI alone: ENABLE_PERSISTENT_CONFIG=false means a
      # UI-only change here doesn't survive a restart, the same trap
      # OPENAI_API_BASE_URL's own comment already documents.
      TASK_MODEL: "${OWUI_TASK_MODEL:-}"
      TASK_MODEL_EXTERNAL: "${OWUI_TASK_MODEL:-}"
      # The address USERS reach this at, which Novak cannot work out: behind a
      # reverse proxy it is a public name on another host that this stack never
      # sees. HOST_NAME is how machines here reach each other, and is the wrong
      # answer whenever a proxy is in front.
      WEBUI_URL: "${OWUI_PUBLIC_URL:-http://${HOST_NAME:-mini.local}:${OPENWEBUI_PORT:-13400}}"
      # Keep everything local: no external telemetry-ish integrations.
      ENABLE_OPENAI_API: "true"
      # Left unset, Open WebUI generates a random key at every container
      # startup, which signs its session JWTs — so every restart or recreate
      # (a routine `novak up`, not just an upgrade) silently logs everyone
      # out. Pin it the same way CONSOLE_AUTH_SECRET is pinned.
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      # .env is the source of truth, not Open WebUI's database.
      #
      # By default Open WebUI copies these settings into its DB on first run and
      # the DB wins forever after, so later .env changes are read and ignored.
      # That is how this instance ended up querying oMLX on port 8080 with the
      # key "changeme" long after both were corrected — healthy-looking, wrong,
      # and invisible to `novak drift`, which cannot see inside a container.
      #
      # With this false the DB is not consulted for config at all: every value
      # comes from the environment, or from Open WebUI's own default where no
      # variable sets one. The cost is that admin-UI changes to anything
      # config-backed do not survive a restart — set it here instead.
      #
      # Chats, users, workspace models, prompts and knowledge are NOT config.
      # They live in other tables and are untouched by this.
      ENABLE_PERSISTENT_CONFIG: "${OWUI_PERSISTENT_CONFIG:-false}"
      # Pocket ID sign-in. Open WebUI has no admin UI for this — it reads these
      # at startup and enables OAuth only when client id, secret and provider
      # URL are all set, so leaving them unset simply leaves you on local
      # accounts. Verified against its own config.py.
      #
      # This needs a SECOND Pocket ID client, separate from the console's: the
      # redirect URI differs, so one client cannot serve both.
      #   http://<HOST_NAME>:13400/oauth/oidc/callback
      OPENID_PROVIDER_URL: "${OWUI_OIDC_ISSUER:-}"
      OAUTH_CLIENT_ID: "${OWUI_OIDC_CLIENT_ID:-}"
      OAUTH_CLIENT_SECRET: "${OWUI_OIDC_CLIENT_SECRET:-}"
      OAUTH_PROVIDER_NAME: "${OWUI_OIDC_PROVIDER_NAME:-Pocket ID}"
      # Pin the callback. Left unset, Open WebUI builds it from the incoming
      # request's Host header — so it becomes whatever name you happened to
      # type, and http://mini.local:13400/... and http://<tailscale-ip>:13400/...
      # are different redirect URIs that BOTH have to be registered with the
      # IdP. Pinning it means one URI to register and the same behaviour from
      # every hostname. Verified in Open WebUI's oauth.py.
      OPENID_REDIRECT_URI: "${OWUI_OIDC_REDIRECT_URI:-${OWUI_PUBLIC_URL:-http://${HOST_NAME:-mini.local}:${OPENWEBUI_PORT:-13400}}/oauth/oidc/login/callback}"
      # Off by default: with signup on, anyone your IdP authenticates gets an
      # account here. Turn it on once the IdP admits only people you mean in.
      ENABLE_OAUTH_SIGNUP: "${OWUI_OIDC_SIGNUP:-false}"
      # admins.novak already exists in Pocket ID — the console's client
      # requests the `groups` scope and gates on it (deploy-checklist.md).
      # Reusing it here, rather than a second group, means one Pocket ID
      # change grants admin in both surfaces instead of two.
      #
      # Two SEPARATE mechanisms, both keyed off the same `groups` claim
      # Pocket ID already returns — Open WebUI does not read one claim for
      # both roles and groups:
      #   - role management grants the admin ROLE (bypasses model RBAC)
      #   - group management syncs actual Open WebUI GROUPS, which is what
      #     "Restricted to admins.novak" on a model checks
      # Pocket ID's default claim is `groups`; OAUTH_ROLES_CLAIM is pointed
      # at it explicitly rather than left on Open WebUI's own default of
      # `roles`, since Pocket ID was never asked for a `roles` scope.
      #
      # Fails safe either way: an unmatched or missing claim grants nothing,
      # not everything, so a misconfigured claim path is a silent no-op, not
      # an accidental admin grant. VERIFY the exact claim shape (some IdPs
      # nest or namespace group names) by decoding the ID token after the
      # first Pocket ID login before relying on this.
      ENABLE_OAUTH_ROLE_MANAGEMENT: "${OWUI_OIDC_ROLE_MANAGEMENT:-true}"
      OAUTH_ROLES_CLAIM: "${OWUI_OIDC_ROLES_CLAIM:-groups}"
      OAUTH_ADMIN_ROLES: "${OWUI_OIDC_ADMIN_ROLES:-admins.novak}"
      ENABLE_OAUTH_GROUP_MANAGEMENT: "${OWUI_OIDC_GROUP_MANAGEMENT:-true}"
      OAUTH_GROUP_CLAIM: "${OWUI_OIDC_GROUP_CLAIM:-groups}"
    volumes:
      # ${OWUI_DATA_DIR:-open-webui} resolves to a bind mount when set (a
      # real host path — e.g. Spire's teracache split, decision #33) or the
      # named volume below when unset (Mitochon's default, unchanged).
      # Compose decides bind-mount vs. named-volume purely from whether the
      # source string matches a key under top-level `volumes:` — no other
      # code path needed for one image to support both deployment shapes.
      - ${OWUI_DATA_DIR:-open-webui}:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # NOTE: none of these services are fronted by a reverse proxy here, on
  # purpose. TLS for them is terminated by the existing internal proxy on
  # another host — see docs/proxy.md for the config to add there, and
  # decision #16 for why. The one exception is the portal below, whose own
  # small Caddy instance fronts exactly one static page and nothing in this
  # comment (decision #22) — it does not change what's said here.

  # ── Console (profiles, memory views, MCP catalog) ─────────────────────
  # Lives in its own repository: novak-konzol. It is an OPTIONAL client of
  # this stack — the registry below can be edited by hand and applied with
  # reconciler/reconcile.py without the console existing at all.
  #
  # Deliberately has NO docker socket. It writes registry/*.yaml over the bind
  # mount; reconciler/reconcile.py (run on the host) is what touches
  # containers. See that repo's README for why.
  #
  # Published by the novak-konzol repo's CI. The package must be public, or
  # this host needs ghcr credentials to pull it.
  # For local development: CONSOLE_IMAGE=novak-konzol:dev
  console:
    # Optional, and gated behind a compose profile so a missing OIDC secret
    # skips the console instead of refusing to start the whole stack. up.sh
    # sets COMPOSE_PROFILES=console once its config is complete.
    profiles: ["console"]
    image: "${CONSOLE_IMAGE:-ghcr.io/almadon/novak-konzol:latest}"
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-13401}:3002"
    environment:
      AUTH_SECRET: "${CONSOLE_AUTH_SECRET}"
      # Same reasoning as OWUI_PUBLIC_URL: if a proxy fronts the console, this
      # must be the name users type, not how machines here reach each other.
      AUTH_URL: "${KONZOL_PUBLIC_URL:-http://${HOST_NAME:-mini.local}:${CONSOLE_PORT:-13401}}"
      AUTH_TRUST_HOST: "true"
      OIDC_ISSUER: "${OIDC_ISSUER}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      # Console talks to Hindsight's REST API directly (server-side), not
      # through MCP — it authenticates users itself via Pocket ID and maps
      # each to their own bank.
      HINDSIGHT_URL: "http://hindsight:8888"
      HINDSIGHT_API_KEY: "${HINDSIGHT_API_KEY}"
    volumes:
      # The one writable path, and the entire interface between the console
      # and this stack. Keep this repo under git — it is the audit log for
      # catalog changes.
      - ./registry:/app/registry
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MCP servers ───────────────────────────────────────────────────────
  # They are NOT defined here. registry/mcp-servers.yaml is the source of
  # truth; reconciler/reconcile.py renders it into docker-compose.mcp.yml and
  # scripts/up.sh applies both files together.
  #
  # To add one, add a registry entry — not a service block here. Two kinds:
  #   kind: container  we run it (memory, vikunja)
  #   kind: external   it already speaks MCP (Outline at https://et.a64.one/mcp)
  # Prefer external whenever a service has its own MCP endpoint.

  # ── Shared long-term memory (Hindsight) ───────────────────────────────
  # Speaks MCP natively at /mcp/<bank>/ — no wrapper, no shim. Postgres is
  # embedded (pg0) in the image, so this is genuinely one container.
  #
  # Identity comes from the URL path: each MCP connection is scoped to one
  # "bank", and the tools have no bank parameter to override it. That is the
  # property that keeps one person's memories out of another's context, and
  # out of reach of anything a model reads. See docs/how-memory-works.md.
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    restart: unless-stopped
    ports:
      - "${HINDSIGHT_PORT:-13403}:8888"   # API + MCP
      - "${HINDSIGHT_UI_PORT:-13404}:9999" # web UI
    environment:
      # Points at DEFAULT_ENGINE_BASE_URL (.env) by default, same as everything else
      # (decision #28). The base-URL variable name is confirmed: Hindsight
      # logs
      #   OpenAI-compatible client initialized: base_url=<the resolved URL>
      # on startup, so it's easy to check extraction is actually reaching
      # where you think it is. Hindsight still asks for its own default
      # model (gpt-4o-mini) because no model name is set here; see
      # docs/STATE.md.
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_LLM_PROVIDER:-openai}"
      # HINDSIGHT_LLM_BASE_URL overrides DEFAULT_ENGINE_BASE_URL above — most often
      # to point extraction at the router's `task` model instead of an
      # engine directly (see .env.example). Blank means Hindsight uses
      # DEFAULT_ENGINE_BASE_URL, same as everything else.
      HINDSIGHT_API_LLM_BASE_URL: "${HINDSIGHT_LLM_BASE_URL:-${DEFAULT_ENGINE_BASE_URL}}"
      HINDSIGHT_API_LLM_API_KEY: "${OMLX_API_KEY:-none}"
      # Without this Hindsight asks for its own default, gpt-4o-mini, which a
      # local server will never have — startup verification fails with "Model
      # not found. Available models: (none)" and extraction is dead. The name
      # must match what oMLX serves (`novak registry` does not list these;
      # check GET /v1/models).
      #
      # The small model on purpose: extraction runs on every memory write, and
      # settings.md keeps the 4B always resident while the 14B unloads after
      # 20 min idle. Pointing this at the 14B means memory writes can pay a
      # model load. Override if extraction quality matters more than latency.
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_LLM_MODEL:-Qwen3-4B-Instruct-2507-4bit}"
      # WITHOUT THESE THE MCP ENDPOINT IS OPEN — no authentication at all.
      # Anything that can reach the port reads and writes every bank.
      HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
      HINDSIGHT_API_TENANT_API_KEY: "${HINDSIGHT_API_KEY}"
    volumes:
      # See OWUI_DATA_DIR's comment above — same pattern.
      - ${HINDSIGHT_DATA_DIR:-hindsight}:/home/hindsight/.pg0
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Wyoming STT/TTS used to run here too (whisper/piper), removed (decision
  # #39): every real deployment ended up using Home Assistant's own native
  # Whisper/Piper add-ons instead — same underlying models
  # (faster-whisper/`auto`, Piper `en_US-lessac-medium`), already wired to
  # a working pipeline, one less network hop from HA to the voice services,
  # and one less thing to keep in sync between two places. openwakeword
  # stays — HA has no native equivalent for server-side wake word detection
  # on Wyoming satellites.

  # Server-side wake word detection ("hey novak"). Only used by Wyoming
  # satellites — HA Voice PE detects on-device with microWakeWord instead.
  # See wakeword/README.md before training a model.
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    command: >
      --preload-model ${WAKEWORD_MODEL:-hey_novak}
      --custom-model-dir /custom
    ports:
      - "${OPENWAKEWORD_PORT:-13407}:10400"
    volumes:
      - ./wakeword/models:/custom:ro

  # ── Portal (single glass pane over Open WebUI and Konzol) ─────────────
  # Optional, and gated behind a compose profile for the same reason the
  # console is: a missing OIDC client must skip this, not refuse to start
  # the rest of the stack. up.sh adds "portal" to COMPOSE_PROFILES once its
  # config is complete. See docs/proxy.md for the full design and what was
  # actually tested versus assumed.
  #
  # This is Novak's first reverse proxy. It fronts nothing but itself —
  # Open WebUI and Konzol keep their own ports and their own already-working
  # Pocket ID logins; tested directly, and Open WebUI's absolute asset paths
  # (/static/..., /_app/immutable/...) do not survive being reverse-proxied
  # under a subpath, which is why this does not attempt to.
  caddy:
    profiles: ["portal"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-13408}:${PORTAL_PORT:-13408}"
    environment:
      PORTAL_PORT: "${PORTAL_PORT:-13408}"
      OPENWEBUI_PORT: "${OPENWEBUI_PORT:-13400}"
      CONSOLE_PORT: "${CONSOLE_PORT:-13401}"
    volumes:
      # ${REPO_DIR}, not a relative ./portal path: compose resolves a
      # relative bind against --project-directory, which up.sh and
      # scripts/novak both set to $NOVAK_HOME, not the checkout. A
      # relative path here silently binds nothing — Docker creates an
      # empty directory at the target instead of erroring, which then
      # fails at the application layer ("Is a directory") rather than at
      # the compose layer, on the very first real run of this profile.
      # Both scripts export REPO_DIR for exactly this. Not seeded into
      # NOVAK_HOME the way registry/mcp-servers.yaml is, on purpose: that
      # file is meant to be edited per-deployment, this one is read-only
      # application config that should track a `git pull` immediately.
      - ${REPO_DIR}/portal/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${REPO_DIR}/portal/index.html:/srv/portal/index.html:ro

  # TinyAuth: forward-auth in front of the portal only, checked against
  # Pocket ID's admins.novak group. AGPL-3.0, run unmodified; see
  # docs/credits.md on why that is the low-risk case for this licence.
  #
  # TINYAUTH_APPURL must be a real hostname, not an IP — confirmed directly:
  # TinyAuth refuses to start with "ip addresses not allowed" against a bare
  # Tailscale IP. mini.local and a Tailscale MagicDNS name both work; see
  # docs/proxy.md if the portal needs to be reachable from off the LAN.
  tinyauth:
    profiles: ["portal"]
    image: ghcr.io/tinyauthapp/tinyauth:v5
    restart: unless-stopped
    ports:
      - "${TINYAUTH_PORT:-13409}:3000"
    environment:
      TINYAUTH_APPURL: "${PORTAL_APPURL:-}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: "Pocket ID"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID: "${TINYAUTH_OIDC_CLIENT_ID:-}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET: "${TINYAUTH_OIDC_CLIENT_SECRET:-}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: "${TINYAUTH_OIDC_AUTH_URL:-}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: "${TINYAUTH_OIDC_TOKEN_URL:-}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: "${TINYAUTH_OIDC_USERINFO_URL:-}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: "openid email profile groups"
      # none, not auto: auto tries to read per-app ACLs from Docker labels,
      # which needs the Docker socket mounted in. Nothing here grants that,
      # deliberately, so config comes only from the explicit vars below.
      TINYAUTH_LABELPROVIDER: "none"
      # Restricts the ONE app this protects (the portal itself) to the same
      # group that already gates the console and now Open WebUI's admin
      # role. One Pocket ID group, three surfaces.
      #
      # VERIFY end to end before trusting this as a real boundary: syntax
      # and startup were tested directly, the actual group-restriction
      # behaviour against a live Pocket ID login was not. Confirm with an
      # account NOT in admins.novak and expect it refused.
      TINYAUTH_APPS_PORTAL_OAUTH_GROUPS: "${TINYAUTH_ADMIN_GROUP:-admins.novak}"
      TINYAUTH_APPS_PORTAL_CONFIG_DOMAIN: "${PORTAL_APPURL:-}"
    volumes:
      - tinyauth:/data

  # ── Inference router (decision #21) ────────────────────────────────────
  # Injects Novak's persona once, here, instead of a copy pasted into every
  # client's own model config. Open WebUI and Home Assistant point their
  # base URL at this instead of at oMLX directly; nothing else in either
  # client changes, since the model names below (chat, deep, ha-voice)
  # match what they already ask for.
  #
  # Optional and gated behind a compose profile, same reasoning as the
  # console and the portal: OMLX_API_KEY is what this needs to reach oMLX,
  # and a deployment that hasn't set it yet should get a stack that starts
  # without the router rather than one that refuses to start at all.
  #
  # Pinned to the exact digest verified against, not :main-stable — that
  # tag moves, and the persona-injection mechanism this relies on
  # (async_pre_call_hook, not LiteLLM's newer CustomPromptManagement API,
  # which was tried first and silently never fired — see
  # router/persona_hook.py) was confirmed against this specific build.
  router:
    profiles: ["router"]
    image: ghcr.io/berriai/litellm@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${ROUTER_PORT:-13402}:4000"
    # env_file, not an enumerated `environment:` allowlist — the whole point
    # of registry/engines.yaml (decision #28/#29) is that an engine's
    # base_url_var/api_key_var can be ANY name, chosen per deployment. A
    # fixed list here defeats that: it silently caps which engines actually
    # work to whichever ones someone remembered to add a line for. Found
    # this the hard way — OLLAMA_LOCAL_BASE_URL wasn't in the old allowlist,
    # so LiteLLM's os.environ/OLLAMA_LOCAL_BASE_URL resolved empty, and it
    # silently fell back to calling real OpenAI's API instead of Ollama,
    # surfacing as an API-key error that had nothing to do with the actual
    # problem. env_file passes the entire deployed .env through instead,
    # so any current or future engine variable just works.
    # DEFAULT_ENGINE_BASE_URL is a real, complete .env value now (decision #28), so
    # env_file below already provides it raw — no environment: override
    # needed here. LiteLLM's config only documents whole-field
    # substitution (os.environ/VARNAME) for values like this, not
    # interpolation inside a larger string, confirmed by testing the
    # alternative and having it silently do nothing useful — which is
    # exactly why this can't be a port glued onto a URL fragment here
    # instead, and has to already be complete in .env.
    env_file:
      - .env
    # A real bug found deploying to Mitochon after this design otherwise
    # proved itself on Spire: env_file above reads .env's LITERAL on-disk
    # text, and a secret's line there is deliberately never the real value
    # (set-in-keychain is a placeholder — up.sh resolves the actual value
    # from Keychain and exports it into ITS OWN shell environment, which is
    # what makes ${OMLX_API_KEY:-none} elsewhere in this file correctly
    # pick up the real value). env_file has no way to see that export; it
    # only ever sees the placeholder string on disk. Router got the literal
    # text "set-in-keychain" as its API key, silently fell back to real
    # OpenAI's endpoint (empty api_base from the SAME root cause, since
    # DEFAULT_ENGINE_BASE_URL didn't exist yet under its old name at the
    # time), and reported a confusing auth error with nothing to do with
    # the actual problem.
    #
    # `environment:` entries take precedence over `env_file` for the same
    # key, and a BARE name (no `=value`) means "take it from the process
    # that's running docker compose" — which for `novak up`/`up.sh` already
    # has the real Keychain value exported. Listed explicitly here because
    # secrets, unlike base URLs, genuinely can't live as real values in
    # .env on disk — that's not a limitation of this mechanism, it's the
    # whole point of Keychain. A future engine with its own NEW secret
    # needs a line added here, the same as it already needs adding to
    # SECRET_VARS in scripts/lib/vars.sh — this isn't a new constraint,
    # it's the existing one, in the one place it was still missing.
    environment:
      - OMLX_API_KEY
    volumes:
      # config.yaml is the ONE exception to "everything the router needs
      # uses ${REPO_DIR}, not a relative path" (see the portal's identical
      # comment above, and the IsADirectoryError bug that established the
      # rule). It's deliberate here: since decision #28, config.yaml is
      # GENERATED per deployment by reconciler/router_apply.py from
      # registry/engines.yaml — which engine serves which model differs
      # by household, so it can't be a checked-in repo file the way
      # persona_hook.py and prompts/ correctly still are. A relative path
      # resolves against --project-directory ($NOVAK_HOME), landing it
      # beside the registry rather than in the checkout — same reasoning
      # as docker-compose.mcp.yml being generated there, never in git.
      - ./router-config.yaml:/app/config.yaml:ro
      - ${REPO_DIR}/router/persona_hook.py:/app/persona_hook.py:ro
      - ${REPO_DIR}/prompts:/prompts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Ollama (Linux/GPU engine) ──────────────────────────────────────────
  # Optional sibling to oMLX (decision #28/#33): oMLX only runs on Apple
  # Silicon (Metal/MLX cannot run in Docker, hence it living on the host
  # rather than here at all). This is the equivalent for a Linux host with
  # a GPU — Spire, RDNA4 via Vulkan, is the reference deployment. Gated
  # behind its own profile so a host with no GPU, or one already running
  # oMLX, never starts a second, unused inference engine by default.
  #
  # Point registry/engines.yaml's base_url_var at
  # http://ollama:11434/v1 (in-network) or http://<host>:${OLLAMA_PORT}/v1
  # (from outside) once this profile is enabled. See docs/ollama-settings.md.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    devices:
      # RDNA4/RDNA3-class AMD GPU passthrough (Vulkan or ROCm). Harmless to
      # list on a host without these nodes — Ollama falls back to CPU-only
      # if they don't resolve, rather than refusing to start (verified on
      # Spire before this device list existed there at all).
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    environment:
      # Vulkan beat ROCm on RDNA4 outright in real benchmarking (RADV
      # GFX1200, decision #33) — no HSA_OVERRIDE_GFX_VERSION hacks needed.
      # A ROCm-only card should set OLLAMA_VULKAN=0 here via .env.
      OLLAMA_VULKAN: "${OLLAMA_VULKAN:-1}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-2}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-4}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-20m}"
    volumes:
      # See OWUI_DATA_DIR's comment above — same pattern. Model weights are
      # large enough that most real deployments will want this pointed at
      # bulk storage (e.g. Spire's teracache), not appdata/Docker's own
      # volume root.
      - ${OLLAMA_DATA_DIR:-ollama}:/root/.ollama

volumes:
  open-webui:
  hindsight:
  tinyauth:
  ollama:
