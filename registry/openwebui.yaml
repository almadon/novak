# What Open WebUI should look like, applied by `novak owui apply` and checked by
# `novak owui drift` (decision #66). Open WebUI keeps these in its own database, so
# without this they are whatever someone last clicked: the tool connection vanished
# once, and a new chat has no tools unless someone remembers to switch them on.
#
# SECRETS DO NOT BELONG HERE. `key_env` names the secret that holds a connection's key
# (`novak secret set`); the value is read at apply time and never written to this file.
# The applier signs in with OWUI_ADMIN_API_KEY, an admin API key made once in Open WebUI
# (Settings, Account, API keys; needs OWUI_ENABLE_API_KEYS=true). Make it on a dedicated
# service account, not on a person's own account.
#
# Only what is listed here is managed. A connection or model preset not named here is
# left alone, and an existing preset keeps its other settings (sharing, parameters).

openwebui:
  # Where the applier reaches Open WebUI from this host. Blank = http://127.0.0.1:$OPENWEBUI_PORT
  url: ""

  tool_servers:
    - id: novak-gateway
      name: Novak gateway
      description: Each person's own tools (house, tasks, notes, memory), through the gateway.
      type: mcp
      url: http://gateway:8000/mcp
      auth_type: bearer
      key_env: OWUI_GATEWAY_KEY            # from `novak gateway client open-webui`
      # X-Novak-User names the person: the gateway trusts this client to say who is asking.
      # X-Novak-Tools keeps the tool list small. The models have an 8,192-token context window
      # and the gateway offers 79 tools (about 34,000 tokens of definitions); a model given all of
      # them loses the start of its prompt. These are the few that matter, about 2,400 tokens
      # (decisions #71, #74): the house, memory, a tasks snapshot, and reading notes.
      headers:
        X-Novak-User: "{{USER_EMAIL}}"
        X-Novak-Tools: "house__*,tasks__*,hindsight_*__recall,hindsight_*__retain,tududi_*__get_task,tududi_*__search,tududi_*__add_to_inbox,tududi_*__complete_task,outline_*__fetch,outline_*__list_documents"

    # Just the lights: for the lean Home preset, a few hundred tokens of tools.
    - id: novak-home
      name: Novak house
      description: Lights and the state of the house only.
      type: mcp
      url: http://gateway:8000/mcp
      auth_type: bearer
      key_env: OWUI_GATEWAY_KEY
      headers: {X-Novak-User: "{{USER_EMAIL}}", X-Novak-Scope: "house", X-Novak-Tools: "house__*"}

  # What people pick from. The router's own roles (chat, deep, task, ha-voice) are plumbing,
  # not choices, so they are hidden from the picker (they keep working underneath, and keep
  # their sharing) and these presets sit on top of them. A new preset is shared with the same
  # people as the model it is built on. Open WebUI sends its own system message whenever tools
  # are on, which makes the router skip the persona (decision #38), so each preset carries the
  # persona and rules itself, built from the prompt files named here.
  models:
    - id: novak
      name: Novak
      description: Your everyday assistant, with the house, tasks, notes and memory.
      base: chat
      capabilities: {builtin_tools: false}   # no ask_user and friends: the persona and gateway tools do the work
      tools: [novak-gateway]
      system_files: [prompts/novak-chat.md, prompts/novak-tools.md, prompts/novak-house.md]

    - id: novak-deep
      name: Novak Deep
      description: Slower and more careful, for hard questions and long reasoning. Same tools.
      base: deep
      capabilities: {builtin_tools: false}   # no ask_user and friends: the persona and gateway tools do the work
      tools: [novak-gateway]
      system_files: [prompts/novak-chat.md, prompts/novak-tools.md, prompts/novak-house.md]

    - id: home
      name: Home
      description: Lights, devices and the house. Quick, short answers.
      base: task                       # the 4B: chose the right tool and arguments on four lighting requests, 0.3 to 1.9 s, and it is always loaded (decision #74)
      capabilities: {builtin_tools: false}   # no ask_user and friends: the persona and gateway tools do the work
      tools: [novak-home]
      system_files: [prompts/novak-tools.md, prompts/novak-house.md, prompts/novak-home.md]

    - id: code
      name: Code
      description: Coding sessions. No house or account tools, more room to think.
      base: deep
      capabilities: {builtin_tools: false}   # no ask_user and friends: the persona and gateway tools do the work
      system_files: [prompts/novak-code.md]

    - {id: chat, hidden: true}
    - {id: deep, hidden: true}
    - {id: task, hidden: true}
    - {id: ha-voice, hidden: true}
