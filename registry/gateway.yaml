# Gateway behaviour (see docs/gateway.md). Seeded by `novak up`; yours to edit.
#
# SECRETS DO NOT BELONG HERE: clients are listed by the hash of their key.

gateway:
  # Which Pocket ID claim names the person. The issuer and audience come from
  # GATEWAY_OIDC_ISSUER and GATEWAY_OIDC_AUDIENCE in .env (blank issuer = OIDC off).
  username_claim: preferred_username

  # Kinds of action held until the person confirms on their phone. Appending
  # (create, add, retain) is never held; removing is. Add `modify` to also hold
  # updates and moves.
  confirm: [destructive]
  confirm_timeout_s: 180

  # Used when a person has no notify block of their own.
  notify_default: {}
  # Approvals through Supernotify (a Home Assistant integration): `notify: {kind: supernotify, target:
  # person.<ha person>}` for a person (`novak person set NAME --supernotify person.x`), or a list of
  # people for notify_default. Supernotify finds that person's phones from Home Assistant itself, so
  # a new phone needs no change here. See docs/gateway.md.
  # The lean house tools (house__house_state, house__lights_set) run on this person-owned registry
  # entry and are offered only to someone who has it. Blank turns them off. See docs/gateway.md.
  house: {entry: ha-mcp}

  # Names for several Home Assistant notify services, so one confirmation reaches every
  # phone in a group: `notify: {kind: ha, service: mgmt}` below sends to each of these.
  notify_groups: {}
  #   mgmt: [mobile_app_pyrite, mobile_app_aquarius]
  # The Home Assistant helper (an input_text) that Approve and Deny buttons write to,
  # which is how a button press reaches the gateway without a browser or an admin token.
  # See docs/gateway.md "Approve and Deny buttons". Blank turns the buttons off; the
  # notification still carries a link.
  approval_helper: ""
  # What the approvals page in Home Assistant shows: while a confirmation waits the gateway
  # writes a short description of it (who, which call) into this input_text, and clears it
  # after. `approval_page` is the dashboard path a tap on the notification opens, inside the
  # app. Both blank = no page, just the buttons.
  pending_helper: ""
  approval_page: ""
  #   pending_helper: input_text.novak_pending
  #   approval_page: /novak-approvals/approvals
  #   approval_helper: input_text.novak_approval

  # Clients trusted to name the user in a header (Open WebUI). Only as safe as
  # the network: nothing but that client may be able to reach the gateway.
  # `novak gateway client open-webui` adds one and shows its key once.
  clients: []

  # Which tools each kind of entry offers. A model given 36 tools for one memory
  # bank explores them (a read-only question once reached for a delete); given
  # the dozen people use, it behaves (Tududi has 65 tools; this offers 27). First filter whose `entries` glob matches
  # decides; `allow` limits to those tools, `deny` removes more. Removal tools
  # kept here still need confirmation. Delete this block to offer everything.
  tool_filters:
    - entries: "hindsight-*"
      allow: [recall, retain, sync_retain, reflect, list_memories, get_memory, update_memory,
              invalidate_memory, list_documents, get_document, delete_document, list_tags,
              get_bank, search_knowledge_base, get_knowledge_page, get_knowledge_base_tree]
    - entries: "tududi-*"
      allow: [list_tasks, get_task, create_task, update_task, complete_task, delete_task, add_subtask,
              add_task_comment, list_task_comments, get_task_metrics, list_projects, get_project,
              create_project, update_project, delete_project, list_areas, list_tags, create_tag,
              list_notes, get_note, create_note, update_note, delete_note, add_to_inbox, list_inbox,
              process_inbox_item, search]
    - entries: "ha-mcp*"
      # 77 tools, most of them configuration, backups, updates, restarts and file or
      # integration management. This offers what a person asks a house for: look
      # something up, read its history, and act on a device or add to a to-do list.
      # Config edits (ha_config_set_*), backups, updates, restarts and device or entity
      # removal stay hidden; list a tool here to offer it. ha_call_service and
      # ha_bulk_control can do anything a service can (including unlock a door), so
      # tool_overrides below makes them ask for confirmation first.
      allow: [ha_search, ha_get_overview, ha_get_state, ha_get_entity, ha_get_entity_exposure,
              ha_get_device, ha_get_history, ha_get_todo, ha_get_zone, ha_get_integration,
              ha_get_automation_traces, ha_list_floors_areas, ha_list_services,
              ha_config_get_automation, ha_config_get_script, ha_config_get_scene,
              ha_config_list_helpers, ha_config_list_groups, ha_config_get_label,
              ha_config_get_category, ha_config_get_calendar_events,
              ha_call_service, ha_bulk_control, ha_set_todo_item, ha_remove_todo_item]
    - entries: "outline-*"
      allow: [list_collections, list_documents, list_collection_documents, fetch, create_document,
              update_document, move_document, delete_document, restore_document, create_comment,
              list_comments]

  # Classify a tool by hand where its name misleads. read | append | modify |
  # destructive. Keyed by registry entry name.
  # Acting on a device through ha-mcp needs a tap: a service call can unlock a door.
  tool_overrides:
    ha-mcp: {ha_call_service: destructive, ha_bulk_control: destructive}
  # ...except the kinds of call nobody needs to approve. A rule lets a held tool through
  # when the call's domain and service (or every bulk operation) are listed; anything
  # else, including a raw ws_command or a target in another domain, is still held.
  # Lights, scenes, media and fans: changing a colour should not need a tap, and a
  # "vaporwave" theme is several calls.
  arg_rules:
    ha-mcp:
      ha_call_service:
        to: modify
        allow:
          light: [turn_on, turn_off, toggle]
          scene: [turn_on]
          fan: [turn_on, turn_off, toggle, set_percentage]
          media_player: [media_play, media_pause, media_stop, media_next_track, media_previous_track,
                         volume_set, volume_mute, volume_up, volume_down, turn_on, turn_off]
      ha_bulk_control:
        to: modify
        allow:
          light: ["on", "off", "toggle"]   # quoted: bare on/off are YAML booleans
          fan: ["on", "off", "toggle"]
