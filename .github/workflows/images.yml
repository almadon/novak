# Builds the images for the two optional services that need one (ingest needs
# ffmpeg, the gateway needs PyJWT) and publishes them to ghcr.io, so a deployment
# pulls them instead of building them: apt installs on the deployment host were
# slow and repeated. Their application code is mounted from the checkout, so an
# image only changes when its Dockerfile does, which is what triggers this.
#
# The first publish creates each package private; make it public once (package
# settings, Change visibility) or the host needs registry credentials to pull.
# Then pin the digest this job prints in docker-compose.yml (decision #45), or
# set INGEST_IMAGE / GATEWAY_IMAGE in .env, and `novak update` pulls it.

name: images

on:
  push:
    branches: [main]
    paths:
      - ingest/Dockerfile
      - gateway/Dockerfile
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ingest, gateway]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/novak-${{ matrix.service }}:main
            ghcr.io/${{ github.repository_owner }}/novak-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Print the digest to pin
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/novak-${{ matrix.service }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
