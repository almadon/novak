# Novak stack. oMLX runs natively on the host (Metal/MLX cannot run in
# Docker); everything here reaches it via host.docker.internal.
# Start with scripts/up.sh (pulls secrets from Keychain), not bare
# `docker compose up`.
#
# PLACEMENT: this file is written for the mini, which runs oMLX and everything
# that wants to be near it — Mem0, memory-mcp, the console, and the Wyoming
# voice services. Open WebUI already runs on a separate VPS and reaches oMLX
# over Tailscale; its service block here is for reference/local testing, not
# the deployed instance. See docs/architecture.md § Placement.

name: novak

services:
  # ── Chat frontend ─────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: "http://host.docker.internal:${OMLX_PORT:-8080}/v1"
      OPENAI_API_KEY: "${OMLX_API_KEY:-none}"
      ENABLE_OLLAMA_API: "false"
      WEBUI_URL: "http://${HOST_NAME:-mini.local}:${OPENWEBUI_PORT:-3000}"
      # Keep everything local: no external telemetry-ish integrations.
      ENABLE_OPENAI_API: "true"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # NOTE: there is no reverse proxy here on purpose. TLS for these services is
  # terminated by the existing internal proxy on another host — see proxy/
  # for the config to add there, and docs/decisions.md #16 for why.

  # ── Console (profiles, memory views, MCP catalog) ─────────────────────
  # Lives in its own repository: novak-konzol. It is an OPTIONAL client of
  # this stack — the registry below can be edited by hand and applied with
  # reconciler/reconcile.py without the console existing at all.
  #
  # Deliberately has NO docker socket. It writes registry/*.yaml over the bind
  # mount; reconciler/reconcile.py (run on the host) is what touches
  # containers. See that repo's README for why.
  #
  # VERIFY THE REGISTRY HOST. Two different hostnames are in play and it is not
  # clear which serves the container registry:
  #   - git remotes use  ssh://git@nex.a64.one/tmeuze/novak-konzol.git
  #   - the Caddy config routes  git.a64.one -> forgejo
  # Container registries speak HTTP, so git.a64.one is the likelier one, but
  # this was not confirmed. Set CONSOLE_IMAGE explicitly rather than trusting
  # this default. For local development:
  #   CONSOLE_IMAGE=novak-konzol:dev
  console:
    image: "${CONSOLE_IMAGE:-git.a64.one/tmeuze/novak-konzol:latest}"
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-3002}:3002"
    environment:
      AUTH_SECRET: "${CONSOLE_AUTH_SECRET}"
      AUTH_URL: "http://${HOST_NAME:-mini.local}:${CONSOLE_PORT:-3002}"
      AUTH_TRUST_HOST: "true"
      OIDC_ISSUER: "${OIDC_ISSUER}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      # Console talks to Mem0's REST API directly (server-side, admin key),
      # not through memory-mcp — it authenticates users itself via Pocket ID.
      MEM0_URL: "http://mem0:8000"
      MEM0_API_KEY: "${MEM0_API_KEY}"
    volumes:
      # The one writable path, and the entire interface between the console
      # and this stack. Keep this repo under git — it is the audit log for
      # catalog changes.
      - ./registry:/app/registry
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MCP servers ───────────────────────────────────────────────────────
  # They are NOT defined here. registry/mcp-servers.yaml is the source of
  # truth; reconciler/reconcile.py renders it into docker-compose.mcp.yml and
  # scripts/up.sh applies both files together.
  #
  # To add one, add a registry entry — not a service block here. Two kinds:
  #   kind: container  we run it (memory, vikunja)
  #   kind: external   it already speaks MCP (Outline at https://et.a64.one/mcp)
  # Prefer external whenever a service has its own MCP endpoint.

  # ── Shared long-term memory (Mem0 self-hosted) ────────────────────────
  # OpenMemory (the original choice) was deprecated and sunset upstream. Its
  # replacement is the unified Mem0 self-hosted server, which is REST-only —
  # memory-mcp (below) provides the MCP interface HA and Open WebUI need, and
  # is where per-user scoping is enforced.
  mem0-db:
    # VERIFY image tag against the pgvector version Mem0 expects.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${MEM0_POSTGRES_USER:-mem0}"
      POSTGRES_PASSWORD: "${MEM0_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${MEM0_POSTGRES_DB:-mem0}"
    volumes:
      - mem0-db:/var/lib/postgresql/data

  mem0:
    # VERIFY: image name/tag for the Mem0 self-hosted server was not confirmed
    # off-host. Check upstream's compose before first run.
    image: mem0/mem0-server:latest
    restart: unless-stopped
    depends_on:
      - mem0-db
    ports:
      - "${MEM0_PORT:-8765}:8000"
    environment:
      DATABASE_URL: "postgresql://${MEM0_POSTGRES_USER:-mem0}:${MEM0_POSTGRES_PASSWORD}@mem0-db:5432/${MEM0_POSTGRES_DB:-mem0}"
      JWT_SECRET: "${MEM0_JWT_SECRET}"
      # LLM + embedder must point at oMLX, not OpenAI. Confirm the exact var
      # names against upstream — see docs/deploy-checklist.md.
      OPENAI_BASE_URL: "http://host.docker.internal:${OMLX_PORT:-8080}/v1"
      OPENAI_API_KEY: "${OMLX_API_KEY:-none}"
      # Never set AUTH_DISABLED here. It bypasses auth entirely and this
      # service holds every user's memories.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # memory-mcp is not defined here — it is a registry entry (`memory`), built
  # from the novak-integracije repo. See registry/mcp-servers.yaml.

  # ── Wyoming voice services for HA Voice ───────────────────────────────
  whisper:
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    command: --model ${WHISPER_MODEL:-small-int8} --language en
    ports:
      - "${WHISPER_PORT:-10300}:10300"
    volumes:
      - whisper:/data

  piper:
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-en_US-lessac-medium}
    ports:
      - "${PIPER_PORT:-10200}:10200"
    volumes:
      - piper:/data

  # Server-side wake word detection ("hey novak"). Only used by Wyoming
  # satellites — HA Voice PE detects on-device with microWakeWord instead.
  # See wakeword/README.md before training a model.
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    command: >
      --preload-model ${WAKEWORD_MODEL:-hey_novak}
      --custom-model-dir /custom
    ports:
      - "${OPENWAKEWORD_PORT:-10400}:10400"
    volumes:
      - ./wakeword/models:/custom:ro

volumes:
  open-webui:
  mem0-db:
  whisper:
  piper:
