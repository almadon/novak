# This repo holds no application code — MCP servers live in
# novak-integracije and the console in novak-konzol, each with its own CI.
# What is validated here is the registry, which is also the risk-acceptance
# gate: a server enabled at elevated or dangerous without a recorded
# acceptance fails the build, the same way it fails a deploy.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    name: MCP registry is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate registry and risk acceptances
        # --dry-run validates and renders without touching containers.
        run: python3 reconciler/reconcile.py --dry-run

  ingest:
    name: Ingest tests and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pyyaml

      - name: Registry file is valid
        working-directory: ingest
        run: python3 -m novak_ingest check ../registry/ingest.yaml

      - name: Unit and pipeline tests
        working-directory: ingest
        run: python3 -m unittest discover -s tests

      - name: Image builds
        run: docker build ingest

  instances:
    name: novak add (instance templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Tests
        run: python3 -m unittest discover -s reconciler/tests

  gateway:
    name: Gateway and people tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: pip install --quiet pyyaml pyjwt cryptography

      - name: Gateway tests
        working-directory: gateway
        run: python3 -W ignore -m unittest discover -s tests

      - name: Image builds
        run: docker build gateway
